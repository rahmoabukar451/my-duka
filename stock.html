{ % extends 'base.html' %}
{ % block title %} stock { % endblock %}
{ % block content %}
    <div>
        <p>this is the stock page</p>
         <div>
        <table id="example" class="table table-striped">
        <thead>
            <tr>
                <th>product id</th>
                <th>product name</th>
                <th>buying price</th>
                <th>selling price</th>
               
            </tr>
        </thead>
        <tbody>
            {% for product in products %}
            <tr>
                <td>{{ product[0] }}</td>
                <td>{{product[1] }}</td>
                <td>{{product[2] }}</td>
                <td>{{product[3] }}</td>
            </tr>
            {% endfor %}
        </tbody>
        </table>
     
        
    </div>
    </div>
{ % endblock %}
