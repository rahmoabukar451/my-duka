{% extends 'base.html' %}
{% block title %} sales {% endblock %}
{% block content %}
<div>
    <p>this is the sales page</p>
   
        <table id="example" class="table table-striped">
            <thead>
                <tr>
                    <th>sales id</th>
                    <th>product name</th>
                    <th>buying price</th>
                    <th>selling price</th>

                </tr>
            </thead>
            <tbody>
                {% for sale in sales %}
                <tr>
                    <td>{{ sale[0] }}</td>
                    <td>{{sale[1] }}</td>
                    <td>{{sale[2] }}</td>
                    <td>{{sale[3] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>


    </div>



</div>
{% endblock %}
