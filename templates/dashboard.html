{% extends "base.html" %}
{% block title %} dashboard {% endblock %}
{% block content %}
<div class="container">
  <div>
    <p>this is the dashboard page</p>
  </div>
  <div>
    <div>
      <canvas id="bar-chart-grouped" width="838" height="458"></canvas>
    </div>
    <div>
      <canvas id="line-chart" width="838" height="458"></canvas>
    </div>
  </div>



</div>
<script>
  new Chart(document.getElementById("bar-chart-grouped"), {
    type: 'bar',
    data: {
      labels: {{ product_names| safe}},
    datasets: [
    {
      label: "sales",
      backgroundColor: "#3e95cd",
      data: {{ sales_data| safe}}
            }, {
      label: "profits",
      backgroundColor: "#8e5ea2",
      data: {{ profit_data| safe}}
            }
  ]
    },
    options: {
      title: {
        display: true,
        text: 'Population growth (millions)'
      }
  }   
});

  new Chart(document.getElementById("line-chart"), {
    type: 'line',
    data: {
      labels: {{ day | safe}},
    datasets: [{
      data: {{ sales_data| safe}},
    label: "sales",
    borderColor: "#3e95cd",
    fill: false
          }, {
      data: {{ profit_data| safe}},
    label: "profits",
    borderColor: "#8e5ea2",
    fill: false
          },
  ]
    },
    options: {
    title: {
      display: true,
      text: 'sales and profit per day(Ksh)'
    }
  }
});
</script>
{% endblock %}
